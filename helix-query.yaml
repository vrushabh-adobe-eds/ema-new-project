version: 1

indices:
  magazine:
    include:
      - '/us/en/magazine/**'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      publicationDate:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      members:
        select: head > meta[name="members"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers("last-modified"), "ddd, DD MMM YYYY hh:mm:ss GMT")
  adventures:
    include:
      - '/us/en/adventures/**'
    target: /us/en/adventures/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      categories:
        select: head > meta[name="categories"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers("last-modified"), "ddd, DD MMM YYYY hh:mm:ss GMT")
  contributors:
    include:
      - '/us/en/contributors/**'
    target: /us/en/contributors/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      role:
        select: head > meta[name="role"]
        value: attribute(el, "content")
      type:
        select: head > meta[name="type"]
        value: attribute(el, "content")
      facebook:
        select: head > meta[name="facebook"]
        value: attribute(el, "content")
      twitter:
        select: head > meta[name="twitter"]
        value: attribute(el, "content")
      instagram:
        select: head > meta[name="instagram"]
        value: attribute(el, "content")
